<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)" />

  <!-- Grid floor line -->
  <line x1="50" y1="360" x2="750" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="10 5" />

  <!-- Car Silhouette -->
  <g transform="translate(40, 20)">
    <!-- Shadow -->
    <ellipse cx="360" cy="340" rx="310" ry="16" fill="#000000" opacity="0.6" filter="url(#neonGlow)"/>

    <!-- Car Body Path -->
    <path d="M 80 290 
             L 120 275 
             L 180 265 
             L 240 215 
             L 360 175 
             L 510 175 
             L 600 240 
             L 680 265 
             L 700 290 
             L 660 300
             C 650 250, 570 250, 560 300 
             L 260 300 
             C 250 250, 170 250, 160 300 
             Z" 
          fill="url(#carBodyGrad)" 
          filter="url(#neonGlow)"/>

    <!-- Cockpit / Glass -->
    <path d="M 260 215 
             L 365 185 
             L 495 185 
             L 575 240 
             L 490 240 
             L 340 240 
             Z" 
          fill="#0f172a" opacity="0.85" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Headlight & Taillight Neon -->
    <path d="M 680 270 L 700 285 L 685 292 Z" fill="#38bdf8" filter="url(#neonGlow)" />
    <path d="M 85 285 L 110 275 L 105 290 Z" fill="#ef4444" filter="url(#neonGlow)" />

    <!-- Front Wheel -->
    <circle cx="210" cy="300" r="45" fill="#090d16" stroke="#475569" stroke-width="6"/>
    <circle cx="210" cy="300" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="210" cy="300" r="10" fill="#38bdf8" />

    <!-- Rear Wheel -->
    <circle cx="610" cy="300" r="45" fill="#090d16" stroke="#475569" stroke-width="6"/>
    <circle cx="610" cy="300" r="30" fill="#1e293b" stroke="#c084fc" stroke-width="3"/>
    <circle cx="610" cy="300" r="10" fill="#c084fc" />

    <!-- Underglow -->
    <line x1="265" y1="315" x2="555" y2="315" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
  </g>

  <!-- Text / Label -->
  <text x="400" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    PERSONAL VEHICLE
  </text>
</svg>
